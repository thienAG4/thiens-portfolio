ba:
  path: /
  title: IT Business Analyst
  seoDescription: >-
    Nguyen Duc Thien, Information Systems student at UEL (VNU-HCM) looking for IT Business Analyst roles.
    Process models, specifications and live products built from them.
  availability: Open to Business Analyst roles
  headline:
    - From business pain points
    - to systems that actually run.
  intro: >-
    Hi, I'm Thien, an Information Systems student at UEL. I map how work really happens,
    write the requirements down, and then prove them with products you can click through.
  about:
    - >-
      I study Information Systems at the University of Economics and Law (VNU-HCM). The part of a
      project I enjoy most is the start: a vague complaint like "drivers call us too late" becomes a
      process model, a set of business rules, and finally a requirement a system can enforce.
    - >-
      I have led the analysis on two team projects, writing the BR/FR/NFR lists, BPMN processes, use case
      specifications and data models, and then checking the built system against them. Because I can also
      read and write code, I turned one of those specs into a deployed product to see where my requirements
      held up and where they did not.
